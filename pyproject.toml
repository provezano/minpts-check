[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minpts-check"
version = "0.2.0"
description = "Check whether an HDBSCAN* flat clustering survives a change of min_samples: one-run shrinkage predictor, certificate and certified range, tie-merged canonical labels"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Felipe Provezano Coutinho"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-learn>=1.3"]

[project.optional-dependencies]
hdbscan = ["hdbscan"]
test = ["pytest", "hdbscan"]

[tool.setuptools]
py-modules = ["minpts_check"]
